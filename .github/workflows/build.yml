name: Build Tidepool OS x86_64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm xorriso mtools grub-pc-bin grub-common

      - name: Build kernel.elf
        run: make

      - name: Create tidepool.iso
        run: make iso

      - name: Verify Multiboot2 header
        run: grub-file --is-x86-multiboot2 build/kernel.elf

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidepool-iso
          path: tidepool.iso
          if-no-files-found: error

      - name: Optional test boot in QEMU
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 || true
          timeout 5 qemu-system-x86_64 -cdrom tidepool.iso -m 256M -smp 1 -nographic -monitor none || true
